<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaque · Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:Arial,sans-serif}.scene{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:20px;text-align:center;text-shadow:0 2px 7px #000}.top{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.12em}.live{color:#ff7771}.live:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#f66;margin-right:7px}.brand{color:var(--accent,#b5ef6a)}.board{width:min(62vw,52vh,420px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #152118;border-radius:4px;box-shadow:0 10px 34px #0009}.sq{display:grid;place-items:center;font-size:clamp(12px,5vw,40px);line-height:1}.light{background:var(--light,#eee6d5)}.dark{background:var(--dark,#78927a)}.white-piece{color:#fffdf4;text-shadow:1px 1px 2px #29372e}.black-piece{color:#26382b;text-shadow:0 1px 2px #e8e5d9}.title,.cta{max-width:min(90vw,620px);background:#101714e8;border-radius:9px;padding:9px 14px;font-weight:700}.cta{font-size:13px;color:#d5f3af}.scene.vertical .board{width:min(76vw,42vh,330px)}.scene.vertical .title{font-size:20px}@media(max-width:600px){.board{width:min(82vw,54vh,420px)}}
</style>
</head>
<body><main id="scene" class="scene"><div class="top"><span class="live">EN VIVO</span><span id="brand" class="brand">JAQUE</span></div><div id="board" class="board"></div><div id="title" class="title">Tu próxima gran partida</div><div id="cta" class="cta">Sígueme para más partidas y análisis</div></main>
<script>
(()=>{'use strict';const symbols={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};const $=id=>document.getElementById(id);function render(){try{const s=JSON.parse(localStorage.getItem('jaque-stream-state')||'{}');if(s.title)$('title').textContent=s.title;if(s.brand)$('brand').textContent=s.brand;if(s.cta)$('cta').textContent=s.cta;if(s.format)$('scene').classList.toggle('vertical',s.format==='vertical');if(s.light)document.documentElement.style.setProperty('--light',s.light);if(s.dark)document.documentElement.style.setProperty('--dark',s.dark);if(s.accent)document.documentElement.style.setProperty('--accent',s.accent);if(s.fen){const placement=s.fen.split(' ')[0].split('/');if(placement.length===8){const b=$('board');b.replaceChildren();for(let r=0;r<8;r++){let row=0;for(const ch of placement[r]){if(/[1-8]/.test(ch)){for(let n=0;n<+ch;n++)add(r,row++,null)}else add(r,row++,ch)}function add(y,x,p){const e=document.createElement('span');e.className='sq '+((y+x)%2?'dark':'light');if(p){const color=p===p.toUpperCase()?'w':'b';e.textContent=symbols[color+p.toLowerCase()];e.classList.add(color==='w'?'white-piece':'black-piece')}b.append(e)}}}}}catch{}}render();setInterval(render,1000)})();
</script></body></html>
